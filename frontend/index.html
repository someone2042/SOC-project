<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity SOC - Glass Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-[#0f172a] text-slate-200 font-sans min-h-screen overflow-x-hidden selection:bg-cyan-500/30">
    <!-- Animated background grid -->
    <div class="fixed inset-0 z-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxwYXRoIGQ9Ik0wIDBMMDQwIDBaIiBmaWxsPSJub25lIi8+CjxwYXRoIGQ9Ik0wIDBMMCA0ME00MCAwTDQwIDQwIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4wMykiIHN0cm9rZS13aWR0aD0iMSIvPgo8cGF0aCBkPSJNMCAwTDQwIDBNMCA0MEw0MCA0MCIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDMpIiBzdHJva2Utd2lkdGg9IjEiLz4KPC9zdmc+')] opacity-50"></div>
    <!-- Glow spheres -->
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-cyan-600/20 blur-[120px] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-600/20 blur-[120px] z-0 pointer-events-none"></div>

    <div class="relative z-10 flex h-screen max-w-7xl mx-auto p-4 sm:p-6 gap-6">
        
        <!-- Sidebar -->
        <aside class="w-72 hidden md:flex flex-col gap-6">
            <div class="glass-panel p-6 flex flex-col gap-2 rounded-2xl border border-slate-700/50 shadow-2xl">
                <h1 class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400">
                    <i class="fa-solid fa-shield-halved mr-2"></i>Antigravity SOC
                </h1>
                <p class="text-sm text-slate-400 font-light">Autonomous AI Triage</p>
            </div>
            
            <div class="glass-panel p-6 flex-1 rounded-2xl border border-slate-700/50 shadow-2xl flex flex-col gap-6">
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Live Metrics</h2>
                <div class="flex flex-col gap-4">
                    <div class="stat-card p-4 rounded-xl bg-slate-800/40 border border-slate-700/30">
                        <div class="text-3xl font-bold text-white" id="stat-total">0</div>
                        <div class="text-xs text-slate-400 mt-1">Total Analyzed</div>
                    </div>
                    <div class="stat-card p-4 rounded-xl bg-emerald-900/20 border border-emerald-500/20">
                        <div class="text-3xl font-bold text-emerald-400" id="stat-fp">0</div>
                        <div class="text-xs text-slate-400 mt-1">False Positives</div>
                    </div>
                    <div class="stat-card p-4 rounded-xl bg-rose-900/20 border border-rose-500/20">
                        <div class="text-3xl font-bold text-rose-400" id="stat-tp">0</div>
                        <div class="text-xs text-slate-400 mt-1">True Positives</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Feed -->
        <main class="flex-1 flex flex-col gap-6 overflow-hidden h-full">
            <header class="glass-panel p-4 rounded-2xl border border-slate-700/50 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)] animate-pulse"></div>
                    <h2 class="font-semibold text-slate-200">Live Investigation Feed</h2>
                </div>
                <button id="refresh-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-sm font-medium transition-colors">
                    <i class="fa-solid fa-rotate-right mr-2"></i>Refresh
                </button>
            </header>

            <div id="alerts-container" class="flex-1 overflow-y-auto pr-2 custom-scrollbar flex flex-col gap-4">
                <!-- Alerts inject here -->
                <div class="flex items-center justify-center h-full text-slate-500 italic">
                    Waiting for Wazuh alerts...
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Glass Box Reasoning -->
    <div id="reasoning-modal" class="fixed inset-0 z-50 hidden bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-4xl max-h-[90vh] rounded-2xl border border-slate-700 shadow-2xl flex flex-col overflow-hidden scale-95 transition-transform duration-300" id="modal-content">
            <div class="p-6 border-b border-slate-700/50 flex justify-between items-start bg-slate-800/40">
                <div>
                    <h3 class="text-xl font-bold text-white mb-1" id="modal-title">Alert Details</h3>
                    <p class="text-sm text-slate-400" id="modal-subtitle">Agent ID</p>
                </div>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 flex flex-col gap-6" id="modal-body">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
